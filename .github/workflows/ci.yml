name: CLOUD-05 Release Safety CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cloud05-release-safety/app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cloud05-release-safety/app/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud05-demo

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'cloud05-release-safety/app/package-lock.json'

      - name: Install Application Dependencies
        working-directory: cloud05-release-safety/app
        run: npm ci

      - name: Run Static Code Analysis (Linter)
        working-directory: cloud05-release-safety/app
        run: npm run lint

      - name: Run Automated Test Suite
        working-directory: cloud05-release-safety/app
        run: npm test

      - name: Dependency Security Audit
        working-directory: cloud05-release-safety/app
        run: |
          echo "Running dependency security audit..."
          npm audit --audit-level=critical || echo "Audit completed with advisory warnings"

  docker-build-and-scan:
    name: Container Build & Vulnerability Scan
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: cloud05-release-safety/app
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},cloud05-demo:local
          build-args: |
            APP_VERSION=1.0.0
            FAILURE_MODE=none

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'cloud05-demo:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && github.actor != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Image to GHCR
        if: github.event_name != 'pull_request' && github.actor != ''
        uses: docker/build-push-action@v5
        with:
          context: cloud05-release-safety/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
