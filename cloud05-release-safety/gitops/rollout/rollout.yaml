apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cloud05-rollout
  namespace: cloud05
  labels:
    app: cloud05-demo
    app.kubernetes.io/name: cloud05-demo
    app.kubernetes.io/part-of: cloud05-release-safety
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cloud05-demo
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 6s }
        - analysis:
            templates:
              - templateName: success-rate-analysis
        - setWeight: 50
        - pause: { duration: 6s }
        - analysis:
            templates:
              - templateName: success-rate-analysis
        - setWeight: 100
  template:
    metadata:
      labels:
        app: cloud05-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-service
          image: cloud05-demo:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cloud05-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
