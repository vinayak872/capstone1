apiVersion: v1
kind: Service
metadata:
  name: cloud05-service
  namespace: cloud05
  labels:
    app: cloud05-demo
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
  selector:
    app: cloud05-demo
---
apiVersion: v1
kind: Service
metadata:
  name: cloud05-canary-service
  namespace: cloud05
  labels:
    app: cloud05-demo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: cloud05-demo
